; ===========================================================================
; Mahoraga — ESP32-S3 Malayalam desktop pet (see AGENTS.md)
;
; NOTE: this file MUST be named exactly "platformio.ini" — PlatformIO finds
; projects by that filename only. The build environment below is named
; "Mahoraga", which is the name shown in VS Code when you build/upload/monitor.
; ===========================================================================

[env:Mahoraga]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit GFX Library
    adafruit/Adafruit SSD1306
    bblanchon/ArduinoJson
build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
